extends: default
font:
  catalog:
    Songti:
      normal: /System/Library/Fonts/Supplemental/Songti.ttc
      bold: /System/Library/Fonts/Supplemental/Songti.ttc
      italic: /System/Library/Fonts/Supplemental/Songti.ttc
      bold_italic: /System/Library/Fonts/Supplemental/Songti.ttc
page:
  margin: [0.5in, 0.5in, 0.5in, 0.5in]
  size: A4
base:
  font-family: Songti
  font-size: 9
  line-height-length: 12
heading:
  font-family: Songti
  h1-font-size: 18
  h2-font-size: 14
  h3-font-size: 12
  h4-font-size: 10
  margin-top: 0.25in
  margin-bottom: 0.08in
prose:
  margin-top: 0
  margin-bottom: 0.06in
ulist:
  marker-font-size: 9
  item-spacing: 0
toc:
  font-family: Songti
  font-size: 8
  line-height: 1.2
literal:
  font-family: Songti
code:
  font-family: Songti
